#
# Weekly: look for a Go release newer than UPSTREAM.md's base (the latest
# stable release, whatever its major version), run scripts/sync-upstream.sh
# on a scratch branch (filter Go's history, check that the filter still
# reproduces upstream/<base>, git merge the new release, commit the
# mechanical rewrite, run the checks), and open an issue with the result.
# Nothing is pushed; a maintainer runs the sync on main.
name: upstream

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The sync merges Go's history: it needs all of ours, with tags.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: tools
        run: |
          pip install git-filter-repo==2.47.0
          git config --global user.name "tlsx upstream check"
          git config --global user.email "tlsx-upstream@users.noreply.github.com"
      - name: Go's repository
        uses: actions/cache@v4
        with:
          path: go-upstream
          key: go-upstream-${{ github.run_id }}
          restore-keys: go-upstream-
      - name: clone or fetch Go
        run: |
          if [ ! -d go-upstream ]; then
            git clone -q --no-checkout https://go.googlesource.com/go go-upstream
          fi
          git -C go-upstream fetch -q --tags origin
      - name: latest stable Go
        id: latest
        run: |
          latest="$(curl -fsSL 'https://go.dev/dl/?mode=json' | jq -r '.[0].version')"
          base="$(sed -n 's/^Base: *\(go[0-9.]*\).*/\1/p' UPSTREAM.md | head -1)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "base $base, latest $latest"
      - name: sync on a scratch branch
        if: steps.latest.outputs.latest != steps.latest.outputs.base
        id: sync
        env:
          SYNC_SUMMARY: summary.md
          TLSX_GO_REPO: ${{ github.workspace }}/go-upstream
          TLSX_SKIP_INTEROP: "1"
          GOTOOLCHAIN: ${{ steps.latest.outputs.latest }}
        run: |
          git switch -c "upstream-sync-${{ steps.latest.outputs.latest }}"
          set +e
          scripts/sync-upstream.sh --no-fetch "${{ steps.latest.outputs.latest }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo
            case "$status" in
            0) echo "Result: merged and checked; run the sync on main." ;;
            2) echo "Result: conflicts left for a maintainer (listed above)." ;;
            3) echo "Result: merged, but the checks failed (above)." ;;
            *) echo "Result: the sync failed (status $status); see the workflow log." ;;
            esac
          } >> summary.md
      - name: open or update an issue
        if: steps.latest.outputs.latest != steps.latest.outputs.base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync: ${{ steps.latest.outputs.base }} -> ${{ steps.latest.outputs.latest }}"
          {
            cat summary.md
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > body.md
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
